services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: tpo-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${OPENBMC_IMAGE_PATH}:/opt/openbmc/openbmc.mtd:ro

volumes:
  jenkins_home:
